set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# ============= cursor enable =============
set -g mouse on

# ======== save session custom keybinding


 set -g @resurrect-save 'S'
 set -g @resurrect-restore 'R'


# Enable Alt+Arrow for pane navigation
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Vim keybindings for pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable vi keybindings for movement inside panes
# setw -g mode-keys vi

# Vim-style copy-paste
# bind [ send-keys -X copy-mode
# bind ] send-keys -X paste-buffer

# Enable mouse support (optional)
# set -g mouse on


#================= tnux plugin manager here ===========

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
